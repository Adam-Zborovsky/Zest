name: zest
description: A playful personal cocktail companion.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  url_launcher: ^6.3.2
  # M5 catalog: on-device source-preserving recipe storage, roadmap-authorized
  # (drift brought forward from M6). drift_flutter is the documented
  # cross-platform opener (NativeDatabase natively, WasmDatabase on web);
  # path_provider is referenced directly by the connection helper per the
  # documented setup.
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  # M7 onboarding and session flags: the flags store already named in
  # AGENTS.md, backing whether onboarding was seen and the local-first
  # profile (no account, credential, or sync).
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  # M7 onboarding: InMemorySharedPreferencesAsync backs the shared
  # session-store contract suite run against the prefs-backed stores.
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Fraunces-OFL.txt
    - assets/fonts/DMSans-OFL.txt
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
