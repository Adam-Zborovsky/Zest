name: zest
description: A playful personal cocktail companion.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Fraunces-OFL.txt
    - assets/fonts/DMSans-OFL.txt
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
