server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Resolve the backend dynamically. This lets Nginx start while the backend
  # restarts and makes Compose service discovery durable.
  resolver 127.0.0.11 valid=30s;

  location = /health {
    set $upstream http://zest-backend:3000/api/health;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
  }

  location /api/ {
    set $upstream http://zest-backend:3000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The backend remains internal-only. The proxy removes browser Origin so
    # its development-only CORS allow-list cannot be bypassed by a public URL.
    proxy_set_header Origin "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
