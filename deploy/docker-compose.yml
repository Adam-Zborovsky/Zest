services:
  zest-backend:
    build:
      context: ../backend
    container_name: zest-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8181
      PHOTO_DIR: /app/data/photos
    depends_on:
      zest-db:
        condition: service_healthy
    volumes:
      - zest_photos:/app/data/photos
    networks:
      - zest-internal

  zest-frontend:
    build:
      context: ../frontend
      args:
        ZEST_API_BASE_URL: ${ZEST_API_BASE_URL:?Set ZEST_API_BASE_URL in deploy/.env}
    container_name: zest-frontend
    restart: unless-stopped
    depends_on:
      - zest-backend
    networks:
      - zest-internal
      - adam-cloud

  zest-db:
    image: postgres:18.6-alpine
    container_name: zest-db
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - zest_postgres_data:/var/lib/postgresql
    networks:
      - zest-internal

networks:
  zest-internal:
    driver: bridge
  adam-cloud:
    external: true

volumes:
  zest_photos:
  zest_postgres_data:
